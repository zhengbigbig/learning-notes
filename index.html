<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习使郑快乐 · AI Agent 源码拆解笔记</title>
<style>
:root {
  --bg: #0a0c14;
  --bg-card: #12141f;
  --bg-card-hover: #181b2a;
  --border: #1e2235;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-dimmer: #64748b;
  --blue: #3b82f6;
  --blue-light: #60a5fa;
  --purple: #a855f7;
  --green: #10b981;
  --orange: #f59e0b;
  --grad-blue: linear-gradient(135deg, #3b82f6, #6366f1);
  --grad-purple: linear-gradient(135deg, #a855f7, #7c3aed);
  --grad-green: linear-gradient(135deg, #10b981, #059669);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
  line-height: 1.7;
  min-height: 100vh;
}

/* Hero */
.hero {
  text-align: center;
  padding: 80px 20px 50px;
  background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(59,130,246,0.12) 0%, transparent 70%);
}
.hero h1 {
  font-size: 2.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, #60a5fa, #a855f7);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.hero p {
  color: var(--text-dim);
  font-size: 1.1rem;
  max-width: 600px;
  margin: 0 auto;
}
.hero .stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 30px;
}
.hero .stat {
  text-align: center;
}
.hero .stat-num {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--blue-light);
}
.hero .stat-label {
  font-size: 0.85rem;
  color: var(--text-dimmer);
  margin-top: 2px;
}

/* Container */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

/* Series section */
.series-section {
  margin-top: 50px;
}
.series-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.series-badge {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  color: white;
}
.series-badge.cc { background: var(--grad-blue); }
.series-badge.pi { background: var(--grad-purple); }
.series-title {
  font-size: 1.4rem;
  font-weight: 700;
}
.series-desc {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-left: auto;
}

/* Article cards */
.cards {
  display: grid;
  gap: 12px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 16px;
}
.card:hover {
  background: var(--bg-card-hover);
  border-color: var(--blue);
  transform: translateX(4px);
}
.card-num {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-dimmer);
  min-width: 36px;
}
.card-body {
  flex: 1;
}
.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 4px;
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-dim);
}
.card-tag {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(59,130,246,0.15);
  color: var(--blue-light);
  white-space: nowrap;
}

/* Footer */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dimmer);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: 60px;
}
.footer a {
  color: var(--blue-light);
  text-decoration: none;
}
</style>
</head>
<body>

<div class="hero">
  <h1>学习使郑快乐</h1>
  <p>从 30 行代码到 5000 行生产系统——AI Agent 源码逐行拆解学习笔记</p>
  <div class="stats">
    <div class="stat">
      <div class="stat-num">35</div>
      <div class="stat-label">篇拆解</div>
    </div>
    <div class="stat">
      <div class="stat-num">2</div>
      <div class="stat-label">个系列</div>
    </div>
    <div class="stat">
      <div class="stat-num">100%</div>
      <div class="stat-label">源码出处</div>
    </div>
  </div>
</div>

<div class="container">

  <!-- Pi Series -->
  <div class="series-section">
    <div class="series-header">
      <span class="series-badge pi">Pi 系列</span>

      <span class="series-desc">14 个文件 5029 行 TypeScript 逐行拆解</span>
    </div>
    <div class="cards" id="pi-cards"></div>
  </div>

  <!-- CC Series -->
  <div class="series-section">
    <div class="series-header">
      <span class="series-badge cc">CC 系列</span>
      <span class="series-title">Claude Code 原理拆解</span>

    <div class="cards" id="cc-cards"></div>
  </div>

</div>

<div class="footer">
  <p>公众号「学习使郑快乐」 · <a href="https://github.com/zhengbigbig/learning-notes">GitHub</a> · 持续更新中</p>
</div>

  {num:'EP02', title:'给AI一套专业工具，循环代码一行没改', file:'cc/EP02-给AI一套专业工具，循环代码一行没改.html'},
  {num:'EP03', title:'让AI碰你的文件前，先过这3道门', file:'cc/EP03-让AI碰你的文件前，先过这3道门.html'},
  {num:'EP04', title:'给AI加心眼：在它动手前后偷偷挂一层逻辑', file:'cc/EP04-给AI加心眼：在它动手前后偷偷挂一层逻辑.html'},

  {num:'衍生01', title:'从ClaudeCode取经如何写出高效的提示词', file:'cc/衍生01-从ClaudeCode取经如何写出高效的提示词.html'},
  {num:'衍生02', title:'AI工具这么成熟还需要关注promptcache吗', file:'cc/衍生02-AI工具这么成熟还需要关注promptcache吗.html'},
  {num:'衍生03', title:'又一个AI编码工具Pi到底有什么不一样', file:'cc/衍生03-又一个AI编码工具Pi到底有什么不一样.html'},
];

function renderCards(episodes, containerId) {
  const container = document.getElementById(containerId);
  episodes.forEach(ep => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = ep.file;
    card.innerHTML = `
      <span class="card-num">${ep.num}</span>
      <div class="card-body">
        <div class="card-title">${ep.title}</div>
        ${ep.desc ? `<div class="card-desc">${ep.desc}</div>` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}

renderCards(piEpisodes, 'pi-cards');
renderCards(ccEpisodes, 'cc-cards');
</script>

</body>
